<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>ROBLOX RU</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;800;900&display=swap" rel="stylesheet">


        <link rel="icon" href="icons/roblox.png">
        <link rel="stylesheet" href="styles/interview-mod.css"> <!-- Стиль страницы -->
    </head>

    <body>
        <video class="background-video" autoplay muted loop playsinline><source src="icons/bg.webm" type="video/mp4"></video>

        <div class="header">
            <div class="icon">
                <a href="home.html">
                    <img src="icons/roblox.png" width="36">
                    <span>ROBLOX RU</span>
                </a>
            </div>

            <div class="btns">
                <a class="active">Правила сервера</a>
                <div class="line"></div>
                <a href="blacklist.html">Чёрный список</a>
                <div class="line"></div>
                <img src="icons/settings.png" width="20">
            </div>
        </div>

        <div class="info">
            <input type="text" id="username" placeholder="Введите никнейм кандидата">
            <input type="text" id="interid" placeholder="Вставьте ID анкеты">
        </div>

        <div class="questions">
            <div class="q">
                <div class="left">
                    <div class="qInfo">Тип 1 — Вопрос №1</div>
                    <span class="qText">Что собой подразумевает тип ЧС - ЧСС? Какие санкции применяются при получении такого ЧС-а?</span>
                    <div class="btn-answer" id="btn-answer">Показать ответ</div>
                    <div class="answer" id="answer">Чёрный список сервера, запрет доступа к серверу.</div>
                </div>
                <div class="right">
                    <span>Оценка</span>
                    <div class="ballGrid">
                        <div class="ballNull">0</div>
                        <div class="ballHalf">0.5</div>
                        <div class="ballFull">1</div>
                    </div>
                </div>
            </div>
        </div>

        <script src="scripts/interview-mod.js"></script>
    </body>
</html>
